name: iOS TestFlight / App Store Release

# Builds and uploads a Sports Scores iOS build to App Store Connect (TestFlight)
# from a GitHub-hosted macOS runner. The runner is on RELEASED macOS + a RELEASED
# Xcode/SDK, which sidesteps the "compiled with a beta product" rejection you get
# when archiving on a beta-OS Mac (which is why this exists — local archives from a
# beta macOS get rejected for the public App Store).
#
# One release for both apps: pushing a v* tag runs this alongside the Windows
# release (scores.yml), so the tag that publishes Scores.exe also uploads the
# same version to TestFlight. The marketing version comes from the VERSION file,
# the same single source the Windows app uses, and the tag must match it.
#
# It can also be run by hand: Actions tab -> "iOS TestFlight / App Store
# Release" -> Run workflow -> pick `main`. Both inputs are optional there.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions).
# See .github/workflows/README-ios-release.md for how to produce each value.
#   ASC_KEY_ID             App Store Connect API key ID
#   ASC_ISSUER_ID          App Store Connect API issuer ID
#   ASC_KEY_P8_BASE64      base64 of the AuthKey_XXXXXXXXXX.p8 file
#   DIST_CERT_P12_BASE64   base64 of the "Apple Distribution" cert + private key (.p12)
#   DIST_CERT_PASSWORD     password you set when exporting that .p12
#
# No app secrets are needed — the app talks to public ESPN / MLB APIs only.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override. Leave blank for one more than the highest build App Store Connect has, or the commit count if that is higher. A value here always wins."
        required: false
        type: string
      marketing_version:
        description: "Marketing version override. Leave blank to use the VERSION file (its first three parts), as a release does."
        required: false
        type: string
      external:
        description: "Also send the build to external TestFlight testers (release tags always do)."
        required: false
        type: boolean
        default: false
      existing_build:
        description: "Skip building: send this already-uploaded build number (of the VERSION version, first three parts) to external testers."
        required: false
        type: string

jobs:
  # A four-part version (v0.9.9.1) is a Windows-only patch release: the tag
  # still triggers this workflow, but there is no iOS build to make. App Store
  # marketing versions allow only three parts, so the iOS project stays on the
  # three-part version (tests/unit/test_version_sync.py checks it).
  platforms:
    runs-on: ubuntu-latest
    outputs:
      ios: ${{ steps.check.outputs.ios }}
    steps:
      - id: check
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Windows-only patch release ($GITHUB_REF_NAME): no iOS build."
            echo "ios=false" >> "$GITHUB_OUTPUT"
          else
            echo "ios=true" >> "$GITHUB_OUTPUT"
          fi

  build-upload:
    needs: platforms
    if: >-
      needs.platforms.outputs.ios == 'true' &&
      (inputs.existing_build == '' || inputs.existing_build == null)
    runs-on: macos-latest
    timeout-minutes: 45
    # One upload at a time, so a second run's build number lookup comes after
    # the first upload rather than racing it.
    concurrency:
      group: ios-build-upload
      cancel-in-progress: false
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: the commit count is the build number's floor

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain and reject beta build machine
        run: |
          set -euo pipefail
          echo "=== xcodebuild ==="
          xcodebuild -version
          echo "=== iOS SDK ==="
          xcrun --sdk iphoneos --show-sdk-version
          echo "iOS SDK build:  $(xcrun --sdk iphoneos --show-sdk-build-version)"
          echo "Xcode build:    $(xcodebuild -version | awk '/Build version/{print $3}')"
          # Apple rejects on BuildMachineOSBuild — the macOS build number of the
          # runner. Released macOS builds end in a digit (e.g. 24A335); beta seeds
          # end in a lowercase letter (e.g. 26A5378j). GitHub-hosted runners are on
          # released macOS, so this passes — it just guarantees we never ship a
          # beta-OS binary to the public App Store.
          OS_BUILD="$(sw_vers -buildVersion)"
          echo "macOS build:    $OS_BUILD"
          if printf '%s' "$OS_BUILD" | grep -qE '[a-z]$'; then
            echo "::error::Build machine is on a beta macOS ($OS_BUILD); App Store would reject. Aborting."
            exit 1
          fi
          echo "Build machine is on released macOS. Proceeding."

      # The App Store Connect API client, used here for the build number and
      # later for the provisioning profile.
      - name: Install App Store Connect API client
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install --quiet "pyjwt[crypto]" requests

      - name: Set version and build number
        id: version
        env:
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
          INPUT_MARKETING_VERSION: ${{ inputs.marketing_version }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUNDLE_ID: com.sportsscores.app
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          # Same guard as the Windows release: a tag that doesn't match VERSION
          # would ship a build whose version disagrees with Scores.exe.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$APP_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($APP_VERSION)."
            exit 1
          fi
          # App Store marketing versions have at most three parts; a four-part
          # VERSION (a Windows-only patch) leaves iOS on its first three.
          MARKETING_VERSION="${INPUT_MARKETING_VERSION:-$(echo "$APP_VERSION" | cut -d. -f1-3)}"
          # Build number: the override if one was given, otherwise
          # max(highest build App Store Connect already has + 1, commit count).
          # The commit count alone repeats after a squash merge (issue #112).
          # If App Store Connect can't be asked, the script warns and falls
          # back to the commit count rather than failing the run.
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          INPUT_BUILD_NUMBER="$(printf '%s' "$INPUT_BUILD_NUMBER" | tr -d '[:space:]')"
          if [ -n "$INPUT_BUILD_NUMBER" ]; then
            BUILD_NUMBER="$INPUT_BUILD_NUMBER"
            echo "Build number override: $BUILD_NUMBER"
          else
            ASC_KEY_P8="$(echo "$ASC_KEY_P8_BASE64" | base64 --decode || true)"
            export ASC_KEY_P8
            BUILD_NUMBER="$("$RUNNER_TEMP/asc/bin/python" \
              iOS/SportsScoresApp/scripts/next_build_number.py "$COMMIT_COUNT" || true)"
            if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
              echo "::warning::The build number lookup failed; using the commit count, $COMMIT_COUNT."
              BUILD_NUMBER="$COMMIT_COUNT"
            fi
          fi
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::Build number '$BUILD_NUMBER' is not a valid build number."
            exit 1
          fi
          echo "Marketing version $MARKETING_VERSION, build $BUILD_NUMBER"
          echo "marketing_version=$MARKETING_VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          PBX=iOS/SportsScoresApp/SportsScores.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9][0-9]*;/CURRENT_PROJECT_VERSION = ${BUILD_NUMBER};/g" "$PBX"
          sed -i '' "s/MARKETING_VERSION = [0-9][0-9.]*;/MARKETING_VERSION = ${MARKETING_VERSION};/g" "$PBX"
          echo "=== resulting versions ==="
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION' "$PBX" | sort -u

      - name: Import signing certificate
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          RUNNER_TMP="${RUNNER_TEMP:-$TMPDIR}"
          KEYCHAIN="$RUNNER_TMP/build.keychain-db"
          KP="$(uuidgen)"   # random one-off keychain password
          echo "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TMP/dist.p12"
          security create-keychain -p "$KP" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KP" "$KEYCHAIN"
          security import "$RUNNER_TMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security list-keychains -d user -s "$KEYCHAIN" "$(security default-keychain | tr -d ' "')"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KEYCHAIN" >/dev/null
          rm -f "$RUNNER_TMP/dist.p12"
          echo "Imported identities:"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Stage App Store Connect API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$DIR"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$DIR/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$DIR/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Signing is manual, with the imported Apple Distribution certificate.
      # Automatic signing had Xcode create a new Apple Development certificate on
      # every fresh runner, until the account hit Apple's limit and archives
      # failed with "reached the maximum number of certificates".
      - name: Install App Store provisioning profile
        id: profile
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUNDLE_ID: com.sportsscores.app
        run: |
          set -euo pipefail
          CERT_SERIAL="$(security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" \
            | openssl x509 -noout -serial | cut -d= -f2)"
          export CERT_SERIAL
          export ASC_KEY_P8="$(cat "$ASC_KEY_PATH")"
          "$RUNNER_TEMP/asc/bin/python" iOS/SportsScoresApp/scripts/appstore_profile.py

      - name: Archive
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project iOS/SportsScoresApp/SportsScores.xcodeproj \
            -scheme SportsScores \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SportsScores.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=P887QF74N8 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            clean archive

      - name: Export App Store IPA
        env:
          PROFILE_NAME: ${{ steps.profile.outputs.profile_name }}
        run: |
          set -euo pipefail
          OPTS="$RUNNER_TEMP/ExportOptions.plist"
          cp iOS/SportsScoresApp/scripts/ExportOptions.plist "$OPTS"
          plutil -replace signingStyle -string manual "$OPTS"
          plutil -replace signingCertificate -string "Apple Distribution" "$OPTS"
          plutil -replace provisioningProfiles -json "{\"com.sportsscores.app\": \"$PROFILE_NAME\"}" "$OPTS"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SportsScores.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$OPTS"
          ls -lh "$RUNNER_TEMP/export/"

      - name: Validate and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' | head -1)"
          [ -n "$IPA" ] || { echo "::error::no .ipa produced"; exit 1; }
          echo "Validating $IPA"
          xcrun altool --validate-app -t ios -f "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploading $IPA"
          xcrun altool --upload-app -t ios -f "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Upload IPA as build artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SportsScores-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore

  # External testers need more than the upload: Apple must finish processing it,
  # the build needs "What to Test" text, and it has to be added to the external
  # groups and submitted for Beta App Review. testflight_external.py does all of
  # that through the App Store Connect API. Runs on Linux: it only calls the API,
  # and spends most of its time waiting for processing.
  external-testflight:
    needs: [platforms, build-upload]
    # always() so it still runs when build-upload is skipped for existing_build.
    if: >-
      always() &&
      needs.platforms.outputs.ios == 'true' &&
      (needs.build-upload.result == 'success' || inputs.existing_build != '') &&
      (github.ref_type == 'tag' || inputs.external || inputs.existing_build != '')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install API client dependencies
        run: pip install "pyjwt[crypto]" requests

      - name: Send to external testers
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          BUNDLE_ID: com.sportsscores.app
          APP_VERSION: ${{ needs.build-upload.outputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.existing_build || needs.build-upload.outputs.build_number }}
        run: |
          set -euo pipefail
          APP_VERSION="${APP_VERSION:-$(tr -d '[:space:]' < VERSION | cut -d. -f1-3)}"
          export APP_VERSION
          export ASC_KEY_P8="$(echo "$ASC_KEY_P8_BASE64" | base64 --decode)"
          NOTES="docs/release-notes-v${APP_VERSION}.md"
          [ -f "$NOTES" ] || NOTES="CHANGELOG.md"
          RELEASE_NOTES="$NOTES" python iOS/SportsScoresApp/scripts/testflight_external.py
