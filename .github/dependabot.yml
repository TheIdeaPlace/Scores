version: 2
updates:
  # Versions of the actions used in .github/workflows/*.yml.
  #
  # Grouped deliberately: a runtime-wide move like the Node 20 -> 24
  # migration touches every action at once, and ungrouped that arrives as
  # one PR per action. As a single PR it is one review and one merge, and
  # the workflows never sit half-migrated between merges.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # requirements.txt. Every version is pinned exactly, so nothing moves
  # unless it moves here.
  #
  # Split into two groups rather than one, because they carry very different
  # risk. The runtime libraries are ordinary upgrades. PyQt6 is the UI
  # toolkit for an app whose accessibility behaviour — screen reader output,
  # keyboard navigation, the three table view modes — is verified by hand,
  # so a Qt bump needs someone to actually drive the app before it lands and
  # should not ride along in a PR full of routine patches.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      python:
        patterns:
          - "*"
        exclude-patterns:
          - "PyQt6*"
      pyqt:
        patterns:
          - "PyQt6*"

  # TheBench/requirements.txt, shaped like the root entry above and for the
  # same reason: PyQt6 is the UI toolkit, so it gets a PR of its own that
  # someone drives the app with before merging, listed first so it never
  # rides along with the routine group.
  - package-ecosystem: pip
    directory: "/TheBench"
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      pyqt:
        patterns:
          - "PyQt6*"
      python:
        patterns:
          - "*"
        exclude-patterns:
          - "PyQt6*"
