name: Validate ESPN data

# Checks the feeds both apps rely on and runs the real Windows parsers on the live data.
# tools/validate_espn.py says exactly what's covered, and what's a failure rather than a
# quiet off-season. Nothing documents these feeds and they change without notice: ESPN
# began rejecting date ranges in September 2026, and the iPhone's football week arrows
# stayed broken until a bug bash found it.
#
# Run it any time from the Actions tab, or:
#     gh workflow run validate-espn.yml
#     gh workflow run validate-espn.yml -f league=NCAAM
#
# The report is on the run's summary page and kept as an artifact. A failed nightly run
# opens an issue, or adds to the open one. The next good nightly run closes it.
#
# Nightly and on demand, the iPhone's real models then decode the payloads this run saved,
# on a Mac. A pull request skips that part.
#
# GitHub turns off scheduled workflows after 60 days with no activity in the repo. If the
# nightly runs have stopped, re-enable this one on the Actions tab.
#
# To try the alarm, which only ever runs for real at night:
#     gh workflow run validate-espn.yml -f alarm_test=fail       opens the issue
#     gh workflow run validate-espn.yml -f alarm_test=recover    closes it, if the run passes

on:
  workflow_dispatch:
    inputs:
      league:
        description: "Just one league, such as NCAAM or NHL. Blank checks everything."
        required: false
        type: string
      alarm_test:
        description: "Try the nightly alarm: fail reports a made-up failure, recover acts on a real pass."
        required: false
        type: choice
        default: none
        options:
          - none
          - fail
          - recover
  schedule:
    # 10:00 UTC, the small hours in the US: last night's games are final by then.
    - cron: '0 10 * * *'
  pull_request:
    paths:
      - 'tools/validate_espn.py'
      - '.github/workflows/validate-espn.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    # The validator gives up on requests after 15 minutes and still writes its report.
    timeout-minutes: 30
    outputs:
      payloads: ${{ steps.saved.outputs.payloads }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Only what the data layer needs, at the versions the app ships. It doesn't touch Qt.
      - name: Install dependencies
        run: |
          grep -E '^(requests|pytz)==' requirements.txt > validator-requirements.txt
          pip install -r validator-requirements.txt

      - name: Validate
        env:
          LEAGUE: ${{ inputs.league }}
          ALARM_TEST: ${{ inputs.alarm_test }}
        run: |
          args=()
          if [ -n "$LEAGUE" ]; then args+=(--league "$LEAGUE"); fi
          if [ "$ALARM_TEST" = "fail" ]; then args+=(--fake-failure); fi
          python tools/validate_espn.py "${args[@]}" --report validation-report.md --json validation-results.json --save-payloads live-payloads

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-report
          path: |
            validation-report.md
            validation-results.json
          if-no-files-found: warn

      - name: Keep the payloads for the iPhone's tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-payloads
          path: live-payloads
          retention-days: 3
          if-no-files-found: warn

      - name: Note whether there are any
        id: saved
        if: always()
        run: |
          if [ -n "$(ls -A live-payloads 2>/dev/null)" ]; then echo "payloads=true" >> "$GITHUB_OUTPUT"; fi

  # A field ESPN drops that the iPhone requires costs it those games. The checks above can't
  # see that: they read these payloads as Windows does.
  ios-decode:
    needs: validate
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.validate.outputs.payloads == 'true' && inputs.alarm_test != 'fail'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Get the payloads
        uses: actions/download-artifact@v8
        with:
          name: live-payloads
          path: live-payloads

      - name: Decode them
        env:
          TEST_RUNNER_LIVE_PAYLOADS: ${{ github.workspace }}/live-payloads
          TEST_RUNNER_LIVE_PAYLOADS_PARTIAL: ${{ inputs.league }}
        run: |
          set -euo pipefail
          ls live-payloads
          device=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcodebuild \
            -project iOS/SportsScoresApp/SportsScores.xcodeproj \
            -scheme SportsScores \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -only-testing:SportsScoresTests/BoxScoreDecodingTests/testLivePayloadsDecode \
            -only-testing:SportsScoresTests/ScoreboardDecodingTests/testLivePayloadsDecode \
            -only-testing:SportsScoresTests/StandingsDecodingTests/testLivePayloadsDecode \
            CODE_SIGNING_ALLOWED=NO \
            test | tee xcodebuild.log
          # All three have to have really run: a skip would mean the payloads never got there,
          # and a renamed test would quietly drop out.
          if ! grep -qE "Executed 3 tests, with 0 failures" xcodebuild.log; then
            echo "The three live tests didn't all run"
            exit 1
          fi

      - name: Pick out what failed
        if: failure()
        run: |
          grep -E "error: .*testLivePayloadsDecode" xcodebuild.log | cut -c1-400 > ios-decode-errors.txt || true

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ios-decode-errors
          path: ios-decode-errors.txt
          if-no-files-found: ignore

  # Kept apart so that the job running code against live data never holds a write token.
  # One open issue, however many nights it takes to fix, rather than one per night.
  alarm:
    needs: [validate, ios-decode]
    if: >-
      always() && needs.validate.result != 'skipped' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.alarm_test != 'none' && inputs.alarm_test != ''))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RESULT: ${{ needs.validate.result }}
      IOS_RESULT: ${{ needs.ios-decode.result }}
      LEAGUE: ${{ inputs.league }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      LABEL: espn-validation
    steps:
      - name: Get the report
        if: needs.validate.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: validation-report

      - name: Get what the iPhone couldn't read
        if: needs.ios-decode.result == 'failure'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ios-decode-errors

      - name: Open, update or close the issue
        run: |
          existing=$(gh issue list --label "$LABEL" --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ "$RESULT" = "success" ] && [ "$IOS_RESULT" = "success" ]; then
            # One league passing says nothing about the rest of what the issue is about.
            if [ -n "$existing" ] && [ -z "$LEAGUE" ]; then
              gh issue close "$existing" --comment "The data check passed again: $RUN_URL"
            fi
            exit 0
          fi
          gh label create "$LABEL" --color D93F0B --description "The live data check failed" --force
          {
            echo "The nightly data check ended in: $RESULT. The iPhone's decode of today's payloads: $IOS_RESULT. $RUN_URL"
            echo
            if [ "$RESULT" = "success" ]; then
              echo "The feeds gave Windows what it needs, so this is about the iPhone."
            elif [ -f validation-report.md ]; then
              sed -n '/^## Failed/,/^## Worth a look\|^## Passed/p' validation-report.md | sed '$d' | head -c 50000
            else
              echo "It stopped before writing a report. The run's log says why."
            fi
            if [ -s ios-decode-errors.txt ]; then
              echo
              echo "What the iPhone couldn't read:"
              echo
              echo '```'
              head -c 10000 ios-decode-errors.txt
              echo
              echo '```'
            fi
          } > issue-body.md
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue-body.md
          else
            gh issue create --title "The nightly ESPN data check failed" --label "$LABEL" --body-file issue-body.md
          fi
