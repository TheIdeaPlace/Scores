name: Coverage

# Once a week, measures how much of the Windows app the tests run and compares it
# with tests/coverage/baseline.json (tools/coverage_check.py has the rules). If a
# file's coverage dropped, it files an issue labelled coverage-regression, or
# comments on the one already open, rather than a new issue every week (#254).
# A run can also be started by hand (Actions, Coverage, Run workflow), and its
# coverage.json is what a new baseline is accepted from (BUILD_GUIDE.md, "Test
# coverage").
#
# This watches the whole app, the UI included. The data layer's floor in
# pyproject.toml, which scores.yml checks on every push, is a separate thing and
# is left as it was: tests/coverage/coveragerc is named on the command line,
# never read in its place.
#
# GitHub turns off scheduled workflows after 60 days with no activity in the repo.
# If the Monday runs have stopped, re-enable this one on the Actions tab.

on:
  schedule:
    - cron: '0 13 * * 1'   # Mondays, 13:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows only, because that's the only place the app's tests run (scores.yml),
  # installed the same way and running the same tests.
  measure:
    name: measure (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      COVERAGE_FILE: .coverage.Windows
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # A separate step: requirements.txt pins coverage too, and a step's exit
      # code in pwsh is its last command's.
      - name: Install the coverage tools
        run: pip install pytest-cov==7.1.0 coverage==7.17.2

      - name: Test
        run: python -m pytest tests/unit/ tests/integration/test_play_audio_wiring.py -q --cov --cov-config=tests/coverage/coveragerc

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-data-Windows
          path: .coverage.Windows
          include-hidden-files: true
          retention-days: 7

  # Only after the measuring succeeded: failed tests would look like a drop. A
  # failed test fails the run, which GitHub reports.
  compare:
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      # The [paths] section in the rc file turns the Windows run's models\ and
      # services\ into the paths this Linux runner has.
      - name: Combine
        run: |
          python -m pip install coverage==7.17.2
          python -m coverage combine --rcfile=tests/coverage/coveragerc
          python -m coverage json --rcfile=tests/coverage/coveragerc -q -o coverage.json
          python -m coverage html --rcfile=tests/coverage/coveragerc -q -d coverage-html

      - name: Compare with the baseline
        id: check
        run: |
          set +e
          python tools/coverage_check.py coverage.json --report coverage-report.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          code=$?
          # 3 is a drop (coverage_check.EXIT_DROPPED); anything else but 0 is
          # the check itself failing.
          [ "$code" -eq 0 ] || [ "$code" -eq 3 ] || exit "$code"
          echo "dropped=$([ "$code" -eq 3 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat coverage-report.md >> "$GITHUB_STEP_SUMMARY"

      # Kept even when the check fails, to see why.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage-report.md
            coverage-html
          if-no-files-found: ignore

      - name: File or update the coverage issue
        if: steps.check.outputs.dropped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          open=$(gh issue list --label coverage-regression --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file coverage-report.md
          else
            gh issue create --label coverage-regression \
              --title "Test coverage dropped ($(date -u +%Y-%m-%d))" --body-file coverage-report.md
          fi
