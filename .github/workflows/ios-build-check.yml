name: iOS Build Check

# Compiles the iOS app for the simulator and stops there. Nothing is signed,
# archived, or uploaded — this exists so a code change can be proven to build
# without going anywhere near App Store Connect or TestFlight.
#
# Use `iOS TestFlight / App Store Release` when you actually want a build on a
# device. This one is safe to run on any commit.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ios-build-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iOS/**'
      - 'tests/fixtures/**'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      # A simulator destination needs no signing identity and no secrets, so a
      # fork or a branch build works without any repository configuration.
      - name: Build for simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project iOS/SportsScoresApp/SportsScores.xcodeproj \
            -scheme SportsScores \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      # The real models against real ESPN payloads, and the geometry against the grid
      # both platforms share. On a named simulator, since tests have to run on one.
      - name: Run tests
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator $device"
          xcodebuild \
            -project iOS/SportsScoresApp/SportsScores.xcodeproj \
            -scheme SportsScores \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            test
